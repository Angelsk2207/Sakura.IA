<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6d6df">
  <title>Sakura.IA</title>
  <link rel="stylesheet" href="/webui/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><span class="mark">✿</span><div><strong>Sakura.IA</strong><small>Cloud NANO</small></div></div><button id="clear" class="icon" aria-label="Limpar conversa">⌫</button></header>
    <section id="messages" class="messages" aria-live="polite"><div class="bubble assistant">Olá! Sou a Sakura.IA. O que vamos construir hoje?</div></section>
    <div id="status" class="status" hidden></div>
    <form id="chat-form" class="composer"><textarea id="message" rows="2" placeholder="Digite ou dite seu pedido..." required></textarea><div class="actions"><select id="task" aria-label="Tipo de tarefa"><option value="chat">Conversa</option><option value="code">Código</option><option value="research">Pesquisa</option><option value="creative">Criativo</option><option value="private">Privado</option></select><button id="send" type="submit">Enviar ↗</button></div></form>
    <details class="models"><summary>Modelos conectados</summary><div id="model-list">Carregando...</div></details>
  </main>
  <script src="/webui/app.js"></script>
</body>
</html>
